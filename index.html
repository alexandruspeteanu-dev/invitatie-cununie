<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitație Cununie Civilă - Amanda & Alexandru</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: #121212; /* Fundal închis pentru ca rama magnolie1.png să se vadă exact la calitatea ei originală */
      color: #4a4238;
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
    }

    .page-wrapper {
      position: relative;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 25px 15px 40px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Rama originala cu culorile ei Reale */
    .frame-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('magnolie1.png');
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      pointer-events: none;
      z-index: 1;
    }

    /* Cardul central deschis la culoare */
    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      margin-top: 30px;
      margin-bottom: 30px;
      background: #fdfbf7;
      padding: 35px 20px;
      border-radius: 12px;
      border: 1px solid #d4af37;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .subtitle {
      font-size: 0.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #b89230;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .names {
      font-family: 'Great Vibes', cursive;
      font-size: 3.6rem;
      color: #4a3324;
      line-height: 1.1;
      margin-bottom: 15px;
    }

    .names span {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      font-style: italic;
      color: #b89230;
      margin: 4px 0;
    }

    .divider {
      width: 50px;
      height: 1px;
      background: #b89230;
      margin: 20px auto;
    }

    .message {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      line-height: 1.5;
      color: #4a4238;
      margin-bottom: 25px;
    }

    .details {
      margin-bottom: 25px;
    }

    .detail-item {
      margin-bottom: 16px;
    }

    .detail-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #b89230;
      font-weight: 600;
      margin-bottom: 3px;
    }

    .detail-val {
      font-size: 1rem;
      color: #2b2520;
      font-weight: 500;
    }

    /* Grup Butoane Hărți & Waze */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 280px;
      margin: 20px auto 0 auto;
    }

    .btn {
      display: block;
      padding: 12px 20px;
      border-radius: 25px;
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }

    .btn-main {
      background: #b89230;
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(184, 146, 48, 0.3);
    }

    .btn-waze {
      background: transparent;
      color: #b89230;
      border: 1px solid #b89230;
    }
  </style>
</head>
<body>

  <div class="page-wrapper">
    <!-- Rama de magnolii exact așa cum e în poza originală -->
    <div class="frame-bg"></div>

    <div class="content">
      <div class="subtitle">Sărbătorim</div>
      
      <h1 class="names">
        Amanda
        <span>&</span>
        Alexandru
      </h1>

      <div class="divider"></div>

      <p class="message">
        Cu bucurie vă invităm să ne fiți alături la celebrarea cununiei noastre!
      </p>

      <div class="details">
        <div class="detail-item">
          <div class="detail-label">Data & Ora</div>
          <div class="detail-val">Sâmbătă, 22 August 2026 — Ora 16:00</div>
        </div>
        
        <div class="detail-item">
          <div class="detail-label">Locația Cununiei Civile</div>
          <div class="detail-val">Primăria Popești-Leordeni</div>
        </div>

        <div class="detail-item">
          <div class="detail-label">Petrecerea</div>
          <div class="detail-val">Restaurant Cosmopolis</div>
        </div>
      </div>

      <div class="btn-group">
        <a href="https://maps.google.com" target="_blank" class="btn btn-main">Google Maps</a>
        <a href="https://waze.com/ul" target="_blank" class="btn btn-waze">Deschide în Waze</a>
      </div>
    </div>
  </div>

</body>
</html>
