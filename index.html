<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitație Cununie Civilă</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    /* Reset & deblocare scroll pe mobil */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: #fcf8f2; /* Fundalul luminos original */
      color: #4a4238;
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
      overflow-y: auto !important; /* Deblochează scroll-ul */
      -webkit-overflow-scrolling: touch;
    }

    .page-wrapper {
      position: relative;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 30px 20px 50px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Rama de magnolii cu eliminare automată de fundal negru prin CSS */
    .frame-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('magnolie1.png');
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      pointer-events: none;
      z-index: 1;
      
      /* Secretul CSS: elimină fundalul negru din imagine */
      mix-blend-mode: screen; 
      filter: contrast(110%) brightness(105%);
    }

    /* Cardul cu conținutul invitației */
    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      margin-top: 40px;
      background: rgba(253, 248, 242, 0.88);
      padding: 35px 20px;
      border-radius: 12px;
      border: 1px solid rgba(184, 146, 48, 0.35);
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    .subtitle {
      font-size: 0.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #b89230;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .names {
      font-family: 'Great Vibes', cursive;
      font-size: 3.8rem;
      color: #5a3d28;
      line-height: 1.1;
      margin-bottom: 20px;
    }

    .names span {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      font-style: italic;
      color: #b89230;
      margin: 5px 0;
    }

    .divider {
      width: 50px;
      height: 1px;
      background: #b89230;
      margin: 20px auto;
    }

    .message {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      line-height: 1.5;
      color: #4a4238;
      margin-bottom: 25px;
    }

    .details {
      margin-bottom: 25px;
    }

    .detail-item {
      margin-bottom: 14px;
    }

    .detail-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #b89230;
      font-weight: 600;
    }

    .detail-val {
      font-size: 1rem;
      color: #2b2520;
      font-weight: 500;
    }

    .btn-location {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 28px;
      background: #b89230;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: 25px;
      font-weight: 600;
      box-shadow: 0 3px 10px rgba(184, 146, 48, 0.25);
    }
  </style>
</head>
<body>

  <div class="page-wrapper">
    <!-- Rama cu magnolie1.png & filtrul CSS de transparență -->
    <div class="frame-bg"></div>

    <div class="content">
      <div class="subtitle">Sărbătorim</div>
      
      <h1 class="names">
        Amanda
        <span>&</span>
        Alex
      </h1>

      <div class="divider"></div>

      <p class="message">
        Cu bucurie vă invităm să ne fiți alături la celebrarea cununiei noastre!
      </p>

      <div class="details">
        <div class="detail-item">
          <div class="detail-label">Data & Ora</div>
          <div class="detail-val">Sâmbătă, 22 August 2026 — Ora 16:00</div>
        </div>
        
        <div class="detail-item">
          <div class="detail-label">Locația Cununiei Civilă</div>
          <div class="detail-val">Primăria Popești-Leordeni</div>
        </div>

        <div class="detail-item">
          <div class="detail-label">Petrecerea</div>
          <div class="detail-val">Restaurant Cosmopolis</div>
        </div>
      </div>

      <a href="https://maps.google.com" target="_blank" class="btn-location">Vezi Locația</a>
    </div>
  </div>

</body>
</html>
